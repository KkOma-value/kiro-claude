server:
  host: 127.0.0.1
  port: 8000

runtime:
  # Only "kiro-live" is supported
  mode: kiro-live
  upstream_endpoint: https://prod.us-east-1.codewhisperer.desktop.kiro.dev
  # If true, server starts even when credentials are unavailable (returns errors on requests).
  allow_start_without_token: false

kiro:
  # Current implementation expands "~" when reading the config file.
  cache_dir: ~/.aws/sso/cache
  enable_multi_account: true
  refresh_interval: 60

proxy:
  http_proxy: ""
  https_proxy: ""
  socks5_proxy: ""

# Proxy API key guard. When set, all API endpoints (except /health)
# require authentication via x-api-key or Authorization: Bearer header.
# Leave empty to disable auth.
security:
  proxy_api_key: ""

logging:
  level: info
  format: text
  # When true, dumps request/response bodies to log for debugging.
  debug_dump: false
